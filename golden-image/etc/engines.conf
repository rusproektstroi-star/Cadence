# Движки, доступные панелям агентов. Один движок — одна строка, поля разделены вертикальной чертой:
#
#   номер | название | команда запуска | исполняемый файл | переменная с ключом | файл канона роли
#
# Номер — то, что человек набирает в таблице (S 2). Он же используется оркестратором.
# Исполняемый файл проверяется на наличие: нет его — движок показан как «не установлен».
# Переменная с ключом проверяется на непустоту: пусто — «нет ключа». Пустое поле означает, что
# движок авторизуется входом, а не ключом, и проверить это заранее нельзя.
# Файл канона роли — то, ЧТО движок читает при старте. У каждого своё, и это главная работа при
# добавлении нового движка: роль надо подать в том виде, который он понимает, иначе он стартует
# без правил и без границ.
#
# Правка этого файла не требует ничего перезапускать: таблица читает его при каждом открытии.

1|claude-code|claude|claude||CLAUDE.md
2|gemini-cli|gemini|gemini|GEMINI_API_KEY|GEMINI.md
3|qwen-code|qwen|qwen|DASHSCOPE_API_KEY|AGENTS.md
4|codex|codex|codex|OPENAI_API_KEY|AGENTS.md
5|deepseek|deepseek|deepseek|DEEPSEEK_API_KEY|AGENTS.md
6|kimi|kimi|kimi|MOONSHOT_API_KEY|AGENTS.md
