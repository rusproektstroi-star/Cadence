# Привязка клавиши для таблицы движков. Подключается из ~/.tmux.conf строкой:
#
#     source-file ~/etc/tmux-engines.conf
#
# ПОЧЕМУ БЕЗ ПРЕФИКСА (-n). Обычная привязка требует сперва нажать Ctrl-b, и это надо помнить.
# Клавиша без префикса работает сразу — а главное, работает ПОКА В ПАНЕЛИ ЗАПУЩЕНА МОДЕЛЬ: tmux
# перехватывает нажатие раньше программы, и агентский CLI о нём даже не узнаёт. Именно поэтому
# команду переключения не нужно набирать в строке ввода, которая ему принадлежит.
#
# ПОЧЕМУ F9. Функциональные клавиши агентские CLI под себя обычно не занимают, в отличие от
# сочетаний с Ctrl. Если конкретный движок всё же перехватит F9 — поменять здесь одну строку.
#
# ПОЧЕМУ #{pane_id} ПЕРЕДАЁТСЯ ЯВНО. Внутри всплывающего окна переменная TMUX_PANE указывает на
# само окно, а не на панель, из которой его позвали. Без явной передачи скрипт переключал бы
# сам себя.
#
# -E закрывает окно, как только скрипт завершился: иначе после смены движка осталась бы висеть
# пустая рамка поверх панели.

bind-key -n F9 display-popup -E -w 62 -h 20 '~/bin/engine-menu #{pane_id}'

# Подсказка в строке состояния tmux, чтобы про клавишу не забывали. Правая часть занята редко,
# место есть.
set -ag status-right ' #[fg=colour244]F9 движки#[default]'
